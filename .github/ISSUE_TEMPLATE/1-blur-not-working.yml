name: A category stopped blurring
description: Something that used to be blurred on web.bale.ai is now visible
labels: [selectors, bug]
body:
  - type: markdown
    attributes:
      value: |
        Bale ships new builds regularly and its class names are per-build hashes, so an
        anchor occasionally disappears. The diagnostics below tell us exactly which one —
        they print counts and DOM paths only, never message content.

        Fixing it yourself: **Options → Advanced selectors** lets you add a CSS selector
        to any category without waiting for a release. See the
        [Selector Maintenance](../../wiki/Selector-Maintenance) page.
  - type: dropdown
    id: category
    attributes:
      label: Which categories
      multiple: true
      options:
        - Chat list names and previews
        - Chat list profile pictures
        - Conversation header
        - Message text
        - Sender names in groups
        - Photos, videos and stickers
        - Sender profile pictures
        - What you are typing
        - Profile and info panels
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Selector diagnostics
      description: >-
        Options page → Advanced selectors → Log selector diagnostics, then reload
        web.bale.ai and paste the rows with 0 matches from the page console.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and extension version
      description: The extension version is at the bottom of the options page.
      placeholder: Chrome 141 / extension 0.1.0
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reloaded the extension and the Bale tab first
          required: true
        - label: The pasted output contains no message text (both tools redact it automatically)
          required: true
