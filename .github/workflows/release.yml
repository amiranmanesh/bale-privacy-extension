name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v1.0.0. Empty builds the default branch.'
        type: string
        required: false
      publish:
        description: Upload to the stores (needs the store secrets)
        type: boolean
        default: false

permissions:
  contents: write

# Hoisted to workflow level on purpose: a step's own `env:` block is not in
# scope when that step's `if:` is evaluated, so gating a publish step on a
# secret defined beside it silently skips the step forever.
env:
  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
  AMO_SLUG: privacy-for-bale-web

jobs:
  package:
    name: Build and publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Read the version and decide what to publish
        id: plan
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A tag push always publishes; a manual run only when asked.
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

          # The version in a tag has to match the manifest, or users end up with
          # a package whose version disagrees with the release it came from.
          ref="${{ inputs.tag || github.ref_name }}"
          case "$ref" in
            v*)
              if [ "${ref#v}" != "$version" ]; then
                echo "::error::Tag $ref does not match package.json version $version"
                exit 1
              fi
              ;;
          esac

      - name: Package
        run: npm run package

      - name: Archive the sources for AMO review
        run: |
          git archive --format=zip --prefix=bale-privacy-source/ \
            -o "release/bale-privacy-source.zip" HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: release/

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

      # ---------------------------------------------------------------------
      # Stores. Each step is skipped when its secrets are absent, so the
      # workflow stays green in a fork and before a store is set up.
      # ---------------------------------------------------------------------

      - name: Check what addons.mozilla.org already has
        id: amo
        if: steps.plan.outputs.publish == 'true' && env.AMO_JWT_ISSUER != ''
        run: |
          live="$(curl -fsSL "https://addons.mozilla.org/api/v5/addons/addon/$AMO_SLUG/" \
            | python3 -c 'import json,sys; print((json.load(sys.stdin).get("current_version") or {}).get("version",""))' || true)"
          echo "live version on AMO: ${live:-unknown}"
          if [ "$live" = "${{ steps.plan.outputs.version }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AMO already has ${{ steps.plan.outputs.version }}, skipping upload"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to addons.mozilla.org
        if: steps.amo.outputs.needed == 'true'
        run: |
          # --upload-source-code is required because the shipped bundles are
          # minified by esbuild; reviewers need the readable sources.
          # --approval-timeout 0 returns as soon as the upload is accepted
          # instead of blocking the job until a human review finishes.
          npx --yes web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir release \
            --channel listed \
            --upload-source-code "release/bale-privacy-source.zip" \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Publish to the Chrome Web Store
        if: steps.plan.outputs.publish == 'true' && env.CHROME_CLIENT_ID != ''
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "release/bale-privacy-${{ steps.plan.outputs.version }}-chrome.zip" \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN" \
            --auto-publish

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${{ steps.plan.outputs.version }}"
            echo
            echo "| Target | Result |"
            echo "| --- | --- |"
            echo "| GitHub release | ${{ startsWith(github.ref, 'refs/tags/v') && 'created' || 'skipped (not a tag)' }} |"
            echo "| addons.mozilla.org | ${{ steps.amo.outputs.needed == 'true' && 'uploaded' || 'skipped' }} |"
            echo "| Chrome Web Store | ${{ env.CHROME_CLIENT_ID != '' && 'uploaded' || 'skipped (no secrets)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
