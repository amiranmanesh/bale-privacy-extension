name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the packages without publishing them
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    name: Build and publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Package
        run: npm run package

      - name: Archive the sources for AMO review
        run: |
          git archive --format=zip --prefix=bale-privacy-source/ \
            -o "release/bale-privacy-source.zip" HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: release/

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true

      # The two publish steps below are skipped entirely until the matching
      # secrets are added to the repository, so the workflow is safe to run in a
      # fork or before the first store submission.
      - name: Publish to the Chrome Web Store
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          inputs.dry_run != true &&
          env.CHROME_CLIENT_ID != ''
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          version="$(node -p "require('./package.json').version")"
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "release/bale-privacy-$version-chrome.zip" \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN"

      - name: Publish to addons.mozilla.org
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          inputs.dry_run != true &&
          env.AMO_JWT_ISSUER != ''
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir release \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
